title: Jordan Alaniz
email: jordan.alaniz@outlook.com
description: >-
  Junior at ASCTE — exploring fire, EMS, nursing, and cybersecurity.
  Varsity distance runner. Wilderness First Responder.
url: "https://jordan-alaniz.github.io"
baseurl: ""

github_username: Jordan-Alaniz
linkedin_username: jordan-alaniz
milesplit_url: "https://al.milesplit.com/athletes/13835251-jordan-alaniz"
gpa: "4.29"
sat: "1310"
act: "32"

permalink: /blog/:title/
markdown: kramdown

include:
  - _pages

collections:
  projects:
    output: true
    permalink: /projects/:path/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      page_bg: blog
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: page
  - scope:
      path: ""
      type: projects
    values:
      layout: project
      page_bg: academics

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor

plugins:
  - jekyll-feed
  - jekyll-sitemap

timezone: America/Chicago


